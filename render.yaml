# Render Blueprint - CNN 이미지 분석 웹앱
# https://dashboard.render.com 에서 연결 시 자동 설정
services:
  - type: web
    name: cnn-image-classifier
    runtime: python
    region: singapore

    # 빌드 설정
    buildCommand: pip install -r requirements.txt

    # 실행 명령 (0.0.0.0:$PORT 바인딩 필수)
    startCommand: gunicorn --workers 1 --timeout 120 --bind 0.0.0.0:$PORT app:app

    # 환경 변수 (Render가 PORT 자동 설정)
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
